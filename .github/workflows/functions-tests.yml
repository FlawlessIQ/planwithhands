name: Functions CI - Emulator tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  functions-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run functions tests under Firestore emulator
        run: npm run test:emulator
        env:
          FIREBASE_PROJECT: demo
