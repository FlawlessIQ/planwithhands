  <!-- Firebase module preloader with compat fallback for environments where dynamic import fails -->
  <script>
    (function() {
      // Attempt to dynamic-import the modern firebase modules used by the app.
      // If this fails (CSP or network), fall back to loading the compat CDN bundles.
      var tried = false;
      function loadCompat() {
        if (tried) return; tried = true;
        var s1 = document.createElement('script');
        s1.src = 'https://www.gstatic.com/firebasejs/11.9.1/firebase-app-compat.js';
        s1.async = false;
        document.head.appendChild(s1);
        var libs = ['auth', 'firestore', 'functions', 'messaging', 'storage'];
        libs.forEach(function(lib) {
          var s = document.createElement('script');
          s.src = 'https://www.gstatic.com/firebasejs/11.9.1/firebase-' + lib + '-compat.js';
          s.async = false;
          document.head.appendChild(s);
        });
      }

      // Try a module import to warm the cache. Some browsers/environments block module fetches.
      try {
        import('https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js')
          .then(function() {
            // good — modules available
          })
          .catch(function(e) {
            // dynamic import failed; fallback to compat bundle
            console.warn('Firebase module import failed, falling back to compat:', e);
            loadCompat();
          });
      } catch (e) {
        // synchronous failures (older browsers) — use compat
        console.warn('Firebase module import threw, loading compat bundle:', e);
        loadCompat();
      }
    })();
  </script>

  <script>
    // Initialize Flutter safely in both `flutter run` (dev) and built (prod) modes.
    // Call loader methods on the `_flutter.loader` object to preserve `this`.
    window.addEventListener('load', function () {
      try {
        var attempts = 0;
        var maxAttempts = 10;

        var startApp = function(loaderFn) {
          try {
            loaderFn.call(_flutter.loader, {
              onEntrypointLoaded: function (engineInitializer) {
                engineInitializer.initializeEngine().then(function (appRunner) {
                  appRunner.runApp();
                });
              }
            });
            return true;
          } catch (e) {
            console.warn('Flutter loader invocation failed:', e);
            return false;
          }
        };

        var tryInit = function() {
          attempts++;
          try {
            if (typeof _flutter !== 'undefined' && _flutter && _flutter.loader) {
              // Prefer modern API when buildConfig is available
              if (typeof _flutter.buildConfig !== 'undefined' && typeof _flutter.loader.load === 'function') {
                if (startApp(_flutter.loader.load)) return;
              }

              // Legacy fallback for development servers that expect loadEntrypoint
              if (typeof _flutter.loader.loadEntrypoint === 'function') {
                if (startApp(_flutter.loader.loadEntrypoint)) return;
              }
            }

            if (attempts < maxAttempts) {
              setTimeout(tryInit, 200);
            } else {
              console.error('Flutter loader not available after retries.');
            }
          } catch (err) {
            if (attempts < maxAttempts) setTimeout(tryInit, 200);
          }
        };

        tryInit();
      } catch (e) {
        console.error('Failed to initialize Flutter loader:', e);
      }
    });
  </script>

  <!-- Service Worker Unregistration Script -->
  <script>
    // Do NOT register any service worker
    if ('serviceWorker' in navigator) {
      // Unregister any previously installed SW so users get fresh files
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      }).catch(()=>{});
      // Optional: clear old caches created by prior SWs
      if (window.caches && caches.keys) {
        caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
      }
    }
  </script>
