<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Renderer: default (auto). Use ?r=html or ?r=ck to force. -->
  <script>
    (function(){
      var params = new URLSearchParams(location.search);
      var r = params.get('r');
      if (r === 'html' || r === 'ck' || r === 'canvaskit') {
        var m = document.createElement('meta');
        m.name = 'flutter-renderer';
        m.content = (r === 'ck' ? 'canvaskit' : r);
        document.head.appendChild(m);
        console.log('[BOOT] Forcing renderer = '+m.content);
      } else {
        console.log('[BOOT] Renderer auto');
      }
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hands_clean">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hands_clean</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Removed always-on env probe box (was here) to clean up UI -->
  <!-- Diagnostic instrumentation: logs progress & surfaces errors directly on page.
       Opt-in with ?diag=1 so normal users are unaffected. -->
  <script>
    (function(){
      // Opt-in: only run the diagnostic pane when the query param diag=1 is present.
      if (!window.location.search || window.location.search.indexOf('diag=1') === -1) {
        return;
      }
      function ensurePane(){
        if(!document.getElementById('diag')){
          const pre=document.createElement('pre');
          pre.id='diag';
          pre.style.cssText='font:12px monospace;white-space:pre-wrap;padding:8px;margin:0;background:#111;color:#0f0;max-height:50vh;overflow:auto';
          document.body.prepend(pre);
        }
        return document.getElementById('diag');
      }
      function log(msg){
        const el=ensurePane();
        const ts=new Date().toISOString().split('T')[1].replace('Z','');
        el.textContent += '['+ts+'] '+msg+'\n';
        console.log('[DIAG]',msg);
      }
      // Expose for Dart code (optional) and mirror selected console logs.
      window.__pushDiag = log;
      (function wrapConsole(){
        const orig = console.log;
        console.log = function(){
          try {
            const msg = Array.from(arguments).join(' ');
            if (/\[(APP|FirebaseInitializer)/.test(msg)) { log(msg); }
          } catch(_) {}
          return orig.apply(this, arguments);
        };
      })();
      window.onerror=function(m,src,l,c,e){
        log('ERROR: '+m+' @'+src+':'+l+':'+c+'\n'+(e&&e.stack||''));
      };
      window.addEventListener('unhandledrejection',e=>{log('UNHANDLED PROMISE: '+e.reason);});
      log('Inline diagnostic start');
      log('UserAgent: '+navigator.userAgent);
      log('Platform: '+navigator.platform+' | Vendor: '+navigator.vendor);
      log('CookiesEnabled: '+navigator.cookieEnabled+' | SW: '+('serviceWorker' in navigator));
      // Periodically check for Flutter attaching a glass pane
      let checks=0; const iv=setInterval(()=>{
        checks++;
  // Fixed selector (removed stray closing parenthesis) and narrowed canvas match to avoid SyntaxError spam on Safari.
  const pane=document.querySelector('flt-glass-pane,#flt-glass-pane,meta[name=flutter],body > canvas');
        if(pane){
          log('Detected Flutter root element: '+pane.tagName);
          clearInterval(iv);
        } else if(checks===10){
          log('Still no Flutter root after ~5s');
        } else if(checks===30){
          log('No Flutter root after ~15s — likely renderer/init failure');
          clearInterval(iv);
        }
      },500);
    })();
  </script>
  <!-- Cache-busting query param to defeat any stale intermediate caches -->
  <script src="flutter_bootstrap.js?v=diag1" async></script>
  <script>
    // Watchdog: if Flutter hasn't added a root element within 20s, inject a minimal fallback UI.
    (function(){
      var start = Date.now();
      var fired = false;
      function hasFlutter(){
        return document.querySelector('flt-glass-pane,#flt-glass-pane,body > canvas');
      }
      function tick(){
        if (fired) return;
        if (hasFlutter()) { fired = true; return; }
        if (Date.now() - start > 20000) {
          fired = true;
          var div = document.createElement('div');
          div.style.cssText='position:fixed;top:0;left:0;right:0;padding:12px;background:#600;color:#fff;font:14px sans-serif;z-index:9998';
          div.innerHTML = 'App failed to load (startup watchdog). Tap to retry.';
          div.onclick = function(){ location.reload(); };
          document.body.appendChild(div);
          console.log('[WATCHDOG] Injected fallback banner');
        } else {
          setTimeout(tick, 500);
        }
      }
      setTimeout(tick, 500);
    })();
  </script>
</body>
</html>
