  <!-- Custom CSS to force white background for Stripe Elements -->
  <style>
    /* Force white background and black text for all Stripe elements */
    iframe[name^="__privateStripeFrame"] {
      background-color: white !important;
    }
    
    /* Stripe Elements styling overrides */
    .StripeElement {
      background-color: white !important;
      color: black !important;
      border: none !important;
      padding: 0 !important;
    }
    
    .StripeElement--focus {
      background-color: white !important;
      color: black !important;
    }
    
    .StripeElement--invalid {
      background-color: white !important;
      color: #dc3545 !important;
    }
    
    /* Platform view container styling */
    flt-platform-view {
      background-color: white !important;
    }
    
    /* Flutter CardField specific styling */
    div[data-testid="card-number-element"],
    div[data-testid="card-expiry-element"], 
    div[data-testid="card-cvc-element"] {
      background-color: white !important;
      color: black !important;
    }
  </style>

  <!-- This script adds the flutter initialization JS inline -->
  <script src="flutter.js" defer></script>

<body>
  <script>
    // Initialize Flutter using the backward-compatible API that works in debug.
    window.addEventListener('load', function () {
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
